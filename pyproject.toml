[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["miniagent*"]

[tool.setuptools.package-data]
miniagent = ["py.typed"]

[project]
name = "miniagent"
version = "0.1.0"
description = "A small, typed Python SDK for AI agents and multi-agent workflows, with any model through LiteLLM."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sudhir Singh"},
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pyyaml>=6.0",
    "litellm>=1.40.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "D100",   # Missing docstring in public module (handled at class/function level)
    "D104",   # Missing docstring in public package (__init__.py files)
    "ANN401", # typing.Any allowed for open-ended data: tool arguments, variables
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # Docstring rules relaxed for test files
    "ANN",    # Annotation rules relaxed for test files
    "S101",   # assert allowed in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["miniagent"]
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
